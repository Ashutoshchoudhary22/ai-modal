[project]
name = "ai-platform-code-indexer"
version = "0.1.0"
description = "Repository intelligence — scan, parse, index, search"
requires-python = ">=3.12"
dependencies = [
    "ai-platform-protocol",
    "ai-platform-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
code-indexer = "code_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_indexer"]

[tool.uv.sources]
ai-platform-protocol = { workspace = true }
ai-platform-shared = { workspace = true }

[project]
name = "ai-platform-agent"
version = "0.1.0"
description = "Coding agent tools — filesystem, search, terminal, git"
requires-python = ">=3.12"
dependencies = [
    "ai-platform-protocol",
    "ai-platform-shared",
    "ai-platform-code-indexer",
    "ai-platform-ai-api",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
ai-platform-protocol = { workspace = true }
ai-platform-shared = { workspace = true }
ai-platform-code-indexer = { workspace = true }
ai-platform-ai-api = { workspace = true }

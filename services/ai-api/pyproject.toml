[project]
name = "ai-platform-ai-api"
version = "0.1.0"
description = "AI inference API service"
requires-python = ">=3.12"
dependencies = [
    "ai-platform-protocol",
    "ai-platform-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
local = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_api"]

[tool.uv.sources]
ai-platform-protocol = { workspace = true }
ai-platform-shared = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring external services",
    "gpu: tests requiring GPU and downloaded model weights",
]

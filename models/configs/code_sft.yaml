# Example coding SFT configuration — Phase 2
# Usage: python training/sft/train.py --config models/configs/code_sft.yaml

experiment:
  name: code-sft-example
  description: "Example coding SFT run — replace dataset and base model before real training"
  seed: 42
  smoke_test: false

model:
  base_model_id: "placeholder/replace-with-real-code-model"
  trust_remote_code: false

tokenizer:
  model_id: null
  use_fast: true

dataset:
  manifest: "training/data/manifests/code_sft.example.json"
  reuse_processed: true

output:
  dir: "models/finetuned/code-sft-v1"
  save_total_limit: 2

training:
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  max_seq_length: 2048
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  gradient_checkpointing: true

lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: []
  quantization: none

hardware:
  device: auto
  precision: auto

registry:
  enabled: false
  model_id: null
  model_name: null
  version: null

wandb:
  enabled: false

prompt_template:
  instruction: "### Instruction:\n{instruction}"
  input: "### Input:\n{input}"
  response: "### Response:\n{output}"

[project]
name = "ai-platform-training"
version = "0.1.0"
description = "Coding model training pipeline for AI Platform"
requires-python = ">=3.12"
dependencies = [
    "ai-platform-protocol",
    "ai-platform-shared",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
train = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "datasets>=3.1.0",
    "accelerate>=1.1.0",
    "peft>=0.13.0",
]
qlora = [
    "bitsandbytes>=0.44.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets", "core", "sft"]

[tool.uv.sources]
ai-platform-protocol = { workspace = true }
ai-platform-shared = { workspace = true }
